[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Keep API requests same-origin in the browser. Netlify proxies them to
# the existing Django backend on Render, which keeps Revnivo's cookie-based
# authentication and CSRF flow reliable without third-party cookies.
[[redirects]]
  from = "/api/*"
  to = "https://revnivo.onrender.com/api/:splat"
  status = 200
  force = true

# Local-media fallback for any legacy/public media URL still returned by
# the backend. Production uploads may be served directly by Cloudinary.
[[redirects]]
  from = "/media/*"
  to = "https://revnivo.onrender.com/media/:splat"
  status = 200
  force = true

# React Router SPA fallback. Keep this last so API/media proxy rules win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
